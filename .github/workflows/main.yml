name: Build FlyBrain APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Find or unpack FlyBrain project
        shell: bash
        run: |
          echo "=== FILES IN REPOSITORY ==="
          find . -maxdepth 4 -type f | sort

          SETTINGS=$(find . -maxdepth 5 -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            ZIPFILE=$(find . -maxdepth 3 -type f -name "*.zip" | head -n 1)

            if [ -z "$ZIPFILE" ]; then
              echo "ERROR: settings.gradle not found and no ZIP found"
              exit 1
            fi

            echo "Found ZIP: $ZIPFILE"

            mkdir -p extracted-project
            unzip -o "$ZIPFILE" -d extracted-project

            SETTINGS=$(find extracted-project -maxdepth 6 -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle still not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Gradle project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Show project
        run: |
          echo "PROJECT_DIR=$PROJECT_DIR"
          ls -la "$PROJECT_DIR"
          ls -la "$PROJECT_DIR/app"

      - name: Build APK
        run: |
          gradle -p "$PROJECT_DIR" :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p output
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" output/FlyBrain-AI.apk
          ls -lh output/FlyBrain-AI.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlyBrain-AI-APK
          path: output/FlyBrain-AI.apk
